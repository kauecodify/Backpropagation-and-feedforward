[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "substation-by-k"
version = "1.0.0"
description = "Operational Intelligence for Digital Substations"
authors = ["K <contact@substationbyk.com>"]
license = "Proprietary"
readme = "README.md"
packages = [
    {include = "src"},
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
neo4j = "^5.15.0"
psycopg2-binary = "^2.9.9"
elasticsearch = "^8.11.0"
redis = "^5.0.1"
timescaledb = "^0.1.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
tensorflow = "^2.15.0"
pyiec61850 = "^0.1.0"
lib60870 = "^0.2.0"
pymodbus = "^3.0.0"
pysnmp = "^5.0.0"
networkx = "^3.2.1"
docker = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.8.0"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
